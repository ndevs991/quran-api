<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murottal Player — Dengarkan Al-Qur'an per Surah | Quran API</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">  
    <link rel="canonical" href="https://quran-api-991.vercel.app/murottal.html">  
    <meta name="description" content="Dengarkan murottal Al-Qur'an per surah lengkap dengan teks arab, terjemahan, dan tafsir. Pilih qori favorit Anda — gratis dan interaktif.">
    
    <script src="/widget.js" async></script>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9PG1DCJC55"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-9PG1DCJC55', {
        cookie_domain: location.hostname
      });
    </script>    
        
   <link rel="stylesheet" href="/murottal.css">
</head>
<body>
  
  <div class="wrapper">
  
      <div class="panel panel-list">
          <div class="search-box">
              <div class="search-input-wrapper">
                  <select id="searchModeSelect" class="search-mode-select" onchange="setSearchMode(this.value)">
                      <option value="surah">Surah</option>
                      <option value="ayah">Ayat</option>
                  </select>              
                  <input type="text" id="searchInput" placeholder="Cari nama surat ...">
                  <button class="search-clear" id="searchClear" style="display:none" onclick="clearSearch()">
                      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                          <path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                      </svg>
                  </button>
              </div>
              <button class="settings-btn" onclick="toggleSettingsPopover(event)">⚙️</button>
          
              <div class="settings-popover" id="settingsPopover">
                  <div class="setting-row">
                      <span class="setting-label">Ukuran Arab</span>
                      <div class="setting-control">
                          <button class="speed-btn" onclick="adjustArabicFontSize(-1)">A−</button>
                          <span class="speed-label" id="fontSizeLabel">Normal</span>
                          <button class="speed-btn" onclick="adjustArabicFontSize(1)">A+</button>
                      </div>
                  </div>
                  <div class="setting-row">
                      <span class="setting-label">Mode putar</span>
                      <div class="setting-control">
                          <select id="playModeSelect" class="jump-select" onchange="setPlayMode(this.value)">
                              <option value="surah">Per Surah</option>
                              <option value="ayah">Per Ayat</option>
                          </select>
                      </div>
                  </div>
              </div>
          </div>
  
          <div class="surah-list" id="surahList"></div>
  
          <div class="footer-box">
              <div class="input-group">
                  <select id="qoriSelect"></select>
                  <button id="saveQori">Simpan</button>
              </div>
              <!--p class="help">Recommend : Mishary Rashid Alafasy</p-->
          </div>
      </div>
  
      <div class="panel panel-player">
          <div class="player-head idle">
              <span id="playerTitle">🕋</span>
              <div class="scroll-controls">
                  <select id="jumpAyahSelect" class="jump-select" onchange="jumpToAyah(this.value)">
                      <option value="">Ayat</option>
                  </select>              
                  <button class="speed-btn" onclick="adjustScrollSpeed(-0.1)">−</button>
                  <span class="speed-label" id="speedLabel">1.0x</span>
                  <button class="speed-btn" onclick="adjustScrollSpeed(0.1)">+</button>
                  <button id="autoScrollBtn" class="autoscroll-btn" style="display:none" onclick="enableAutoScroll()">
                      Auto-Scroll
                  </button>
              </div>
          </div>
  
          <div class="player-body">
              <div class="glow"></div>
              <div class="player-body-inner">
                  <div id="playerContent">
                      <span id="playerText">Silahkan pilih Surat disamping untuk mendengarkan.</span>
                  </div>
              </div>
          </div>
  
          <div class="player-controls">
              <button class="play-btn" id="playBtn" disabled>&#9654;</button>
              <span class="time" id="currentTime">0:00</span>
              <input type="range" class="seek" id="seekBar" value="0" min="0" max="100" step="1" disabled>
              <span class="time" id="duration">0:00</span>
              <span id="volumeIcon">&#128266;</span>
              <input type="range" class="volume" id="volumeBar" value="100" min="0" max="100" step="1">
          </div>
      </div>
  
  </div>
  
  <div class="tafsir-modal-overlay" id="tafsirOverlay" onclick="if(event.target===this) closeTafsir()">
      <div class="tafsir-modal">
          <div class="tafsir-modal-head">
              <h3 id="tafsirTitle">Tafsir</h3>
              <button class="tafsir-modal-close" onclick="closeTafsir()">&times;</button>
          </div>
          <div class="tafsir-tabs">
              <button class="tafsir-tab active" data-source="kemenag" onclick="switchTafsirTab('kemenag')">Kemenag</button>
              <button class="tafsir-tab" data-source="quraish" onclick="switchTafsirTab('quraish')">Quraish Shihab</button>
              <button class="tafsir-tab" data-source="jalalayn" onclick="switchTafsirTab('jalalayn')">Jalalayn</button>
          </div>
          <div class="tafsir-body" id="tafsirBody"></div>
      </div>
  </div>
  
  <div class="tafsir-modal-overlay" id="embedOverlay" onclick="if(event.target===this) closeEmbed()">
      <div class="tafsir-modal">
          <div class="tafsir-modal-head">
              <h3 id="embedTitle">Sematkan Ayat</h3>
              <button class="tafsir-modal-close" onclick="closeEmbed()">&times;</button>
          </div>
          <div class="tafsir-body embed-body">
              <div class="embed-row">
                  <span class="setting-label">Tema</span>
                  <select id="embedTheme" class="jump-select" onchange="renderEmbed()">
                      <option value="light">Terang</option>
                      <option value="dark">Gelap</option>
                  </select>
              </div>
              <div id="embedPreview"></div>
              <textarea id="embedCode" class="embed-code" readonly rows="4"></textarea>
              <button class="embed-copy" onclick="copyEmbedCode()">Salin Kode</button>
          </div>
      </div>
  </div>
  
  <audio id="audioPlayer"></audio>
  <audio id="ayahAudioPlayer"></audio>  

   <script src="/murottal.js"></script>

</body>
</html>
