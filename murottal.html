<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murottal - Quran API</title>
<style>
   @font-face {
     font-family: 'Amiri';
     font-style: normal;
     font-weight: 400;
     font-display: swap;
     src: url(https://fonts.gstatic.com/s/amiri/v17/J7aRnpd8CGxBHpUrtLMA7w.woff2) format('woff2');
     unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE80-FEFC;
   }
   
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b1120;
        color: #e2e8f0;
         display: flex;
         justify-content: center;
         align-content: center;
         align-items: center;
         height: 100vh;
         width: 100vw;
         overflow: hidden;
         overflow-y: scroll;
    }

    .wrapper {
        display: flex;
        gap: 16px;
        max-width: 900px;
        margin: auto;
        height: 460px;
    }

    .panel {
        background: #111827;
        border: 1px solid #1e293b;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .panel-list {
        flex: 1;
    }

    .panel-player {
        flex: 1;
    }

   .search-box {
       height: 64px;
       display: flex;
       align-items: center;
       padding: 0 14px;
       border-bottom: 1px solid #1e293b;
   }

    .search-box input {
        width: 100%;
        padding: 10px 12px;
        background: #0b1120;
        border: 1px solid #1e293b;
        border-radius: 6px;
        color: #e2e8f0;
        font-size: 14px;
    }

    .search-box input::placeholder {
        color: #64748b;
    }

    .surah-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        align-content: start;
    }

    .surah-btn {
        background: #1e293b;
        border: 1px solid #2b3648;
        color: #7dd3fc;
        padding: 10px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        text-align: center;
       /*
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
       */
    }

    .surah-btn:hover {
        background: #263349;
    }

    .surah-btn.active {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
    }

    .footer-box {
        padding: 14px;
        border-top: 1px solid #1e293b;
    }

    .footer-box .input-group {
        display: flex;
        gap: 8px;
    }

    .footer-box select {
        flex: 1;
        padding: 8px 10px;
        background: #0b1120;
        border: 1px solid #1e293b;
        border-radius: 6px;
        color: #e2e8f0;
        font-size: 13px;
    }

    .footer-box button {
        padding: 8px 16px;
        background: #2563eb;
        border: 0;
        border-radius: 6px;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
    }

    .footer-box button:hover {
        background: #1d4ed8;
    }

    .footer-box .help {
        margin: 8px 0 0;
        font-size: 12px;
        color: #64748b;
    }

   .player-head {
       height: 64px;
       display: flex;
       align-items: center;
       justify-content: center;
       padding: 0 20px;
       border-bottom: 1px solid #1e293b;
       font-size: 18px;
       font-weight: bold;
   }

   .player-body {
       flex: 1;
       position: relative;
       overflow: hidden;
   }

   .player-body-inner {
       height: 100%;
       overflow-y: scroll;
       display: flex;
       align-items: flex-start;
       justify-content: center;
       text-align: center;
       padding: 20px;
       font-size: 14px;
       color: #cbd5e1;
       position: relative;
       z-index: 1;
       box-sizing: border-box;
   }

    .player-body .glow {
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(37,99,235,0.35), transparent 70%);
        right: -60px;
        bottom: -60px;
        pointer-events: none;
    }

    .player-body span {
        position: relative;
        z-index: 1;
    }

    .player-icon {
        font-size: 22px;
        margin-bottom: 12px;
        position: relative;
        z-index: 1;
    }

    .player-description {
        position: relative;
        z-index: 1;
        line-height: 1.7;
    }

   .ayah-list {
       position: relative;
       z-index: 1;
       text-align: right;
       width: 100%;
   }
   
   .ayah-item {
       padding: 14px 0;
       border-bottom: 1px solid #1e293b;
   }
   
   .ayah-item:last-child {
       border-bottom: 0;
   }
   
   .ayah-arab {
   	font-size: 21px;
   	line-height: 2;
   	margin: 0 0 10px;
   	font-family: "Amiri","Traditional Arabic",Tahoma,sans-serif;
   	font-weight: normal;
   	text-align: right;
   	direction: rtl;
   }
   
   .ayah-translation {
       text-align: left;
       font-size: 13px;
       color: #94a3b8;
       line-height: 1.6;
       margin: 0;
   }

    .player-controls {
        padding: 14px 18px;
        border-top: 1px solid #1e293b;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .play-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 0;
        background: #e2e8f0;
        color: #0b1120;
        cursor: pointer;
        font-size: 14px;
        flex-shrink: 0;
    }

    .play-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .seek {
        flex: 1;
        accent-color: #2563eb;
    }

    .time {
        font-size: 12px;
        color: #94a3b8;
        white-space: nowrap;
    }

    .volume {
        width: 70px;
        accent-color: #2563eb;
    }

    input[type="range"] {
        height: 4px;
    }

    ::-webkit-scrollbar {
        width: 6px;
    }

    ::-webkit-scrollbar-thumb {
        background: #2b3648;
        border-radius: 3px;
    }
</style>
</head>
<body>

<div class="wrapper">

    <div class="panel panel-list">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari nama surat ...">
        </div>

        <div class="surah-list" id="surahList"></div>

        <div class="footer-box">
            <div class="input-group">
                <select id="qoriSelect"></select>
                <button id="saveQori">Simpan</button>
            </div>
            <p class="help">Recommend : Mishary Rashid Alafasy</p>
        </div>
    </div>

    <div class="panel panel-player">
        <div class="player-head" id="playerTitle">🕋</div>

         <div class="player-body">
             <div class="glow"></div>
             <div class="player-body-inner">
                 <div id="playerContent">
                     <span id="playerText">Silahkan pilih Surat disamping untuk mendengarkan.</span>
                 </div>
             </div>
         </div>

        <div class="player-controls">
            <button class="play-btn" id="playBtn" disabled>&#9654;</button>
            <span class="time" id="currentTime">0:00</span>
            <input type="range" class="seek" id="seekBar" value="0" min="0" max="100" step="1" disabled>
            <span class="time" id="duration">0:00</span>
            <span id="volumeIcon">&#128266;</span>
            <input type="range" class="volume" id="volumeBar" value="100" min="0" max="100" step="1">
        </div>
    </div>

</div>

<audio id="audioPlayer"></audio>

<script>
    const API_BASE = "";
    const audio = document.getElementById("audioPlayer");
    const surahListEl = document.getElementById("surahList");
    const searchInput = document.getElementById("searchInput");
    const qoriSelect = document.getElementById("qoriSelect");
    const saveQoriBtn = document.getElementById("saveQori");
    const playBtn = document.getElementById("playBtn");
    const seekBar = document.getElementById("seekBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const volumeBar = document.getElementById("volumeBar");
    const volumeIcon = document.getElementById("volumeIcon");

    let surahs = [];
    let activeBtn = null;

    function formatTime(sec) {
        if (!isFinite(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
    }

    function getSelectedQori() {
        return localStorage.getItem("qoriah_murottal") || "ar.alafasy";
    }

    async function loadSurahs() {
        const res = await fetch(`${API_BASE}/surahs`);
        surahs = await res.json();
        renderSurahList(surahs);
    }

    function renderSurahList(list) {
        surahListEl.innerHTML = "";
        list.forEach(surah => {
            const btn = document.createElement("button");
            btn.className = "surah-btn";
            btn.textContent = surah.name;
            btn.dataset.number = surah.number;
            btn.onclick = () => playSurahByNumber(surah.number);
            surahListEl.appendChild(btn);
        });
    }

    async function loadQoriahs() {
        const res = await fetch(`${API_BASE}/qoriahs`);
        const qoriahs = await res.json();
        qoriSelect.innerHTML = "";
        qoriahs.forEach(q => {
            const opt = document.createElement("option");
            opt.value = q.identifier;
            opt.textContent = q.name;
            qoriSelect.appendChild(opt);
        });
        qoriSelect.value = getSelectedQori();
    }

    async function playSurahByNumber(number) {
        const surah = surahs.find(s => s.number === number);
        if (!surah) return;

        const btn = surahListEl.querySelector(`.surah-btn[data-number="${number}"]`);
        if (activeBtn) activeBtn.classList.remove("active");
        if (btn) {
            btn.classList.add("active");
            activeBtn = btn;
        } else {
            activeBtn = null;
        }

        document.getElementById("playerTitle").textContent = "Memuat ...";
        document.getElementById("playerContent").innerHTML = `<span id="playerText">Memuat ${surah.name} ...</span>`;

        try {
            const qori = getSelectedQori();
            const [detailRes, audioRes] = await Promise.all([
                fetch(`${API_BASE}/surahs/${surah.number}`),
                fetch(`${API_BASE}/surahs/${surah.number}/audio?qori=${qori}`)
            ]);
            const detail = await detailRes.json();
            const audioData = await audioRes.json();

            audio.dataset.currentNumber = surah.number;
            audio.src = audioData.audio;
            audio.play();

            document.getElementById("playerTitle").textContent = `${detail.name} - ${detail.revelation}`;
            
            const ayahsHtml = detail.ayahs.map(ayah => `
                <div class="ayah-item">
                    <p class="ayah-arab">${ayah.arab} <span style="color:#64748b; font-size:14px;">(${ayah.number.inSurah})</span></p>
                    <p class="ayah-translation">${ayah.translation}</p>
                </div>
            `).join("");
            
            document.getElementById("playerContent").innerHTML = `
                <div class="ayah-list">${ayahsHtml}</div>
            `;

            playBtn.disabled = false;
            seekBar.disabled = false;
        } catch (err) {
            document.getElementById("playerContent").innerHTML = `<span id="playerText">Gagal memuat audio.</span>`;
        }
    }

    audio.onended = () => {
        const current = Number(audio.dataset.currentNumber);
        const next = surahs.find(s => s.number === current + 1);
        if (next) {
            playSurahByNumber(next.number);
        }
    };

    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
        } else {
            audio.pause();
        }
    };

    audio.onplay = () => {
        playBtn.innerHTML = "&#10073;&#10073;";
    };

    audio.onpause = () => {
        playBtn.innerHTML = "&#9654;";
    };

    audio.ontimeupdate = () => {
        if (audio.duration) {
            seekBar.value = (audio.currentTime / audio.duration) * 100;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            durationEl.textContent = formatTime(audio.duration);
        }
    };

    seekBar.oninput = () => {
        if (audio.duration) {
            audio.currentTime = (seekBar.value / 100) * audio.duration;
        }
    };

    volumeBar.oninput = () => {
        audio.volume = volumeBar.value / 100;
        volumeIcon.innerHTML = audio.volume == 0 ? "&#128263;" : "&#128266;";
    };

    volumeIcon.onclick = () => {
        audio.muted = !audio.muted;
        volumeIcon.innerHTML = audio.muted ? "&#128263;" : "&#128266;";
    };

    searchInput.oninput = () => {
        const q = searchInput.value.toLowerCase();
        renderSurahList(surahs.filter(s => s.name.toLowerCase().includes(q)));
    };

    saveQoriBtn.onclick = () => {
        localStorage.setItem("qoriah_murottal", qoriSelect.value);
        saveQoriBtn.textContent = "Tersimpan";
        setTimeout(() => saveQoriBtn.textContent = "Simpan", 1200);
    };

    loadSurahs();
    loadQoriahs();
</script>

</body>
</html>
